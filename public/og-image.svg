  </text>
  <text x="100" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Live Performance &amp; Rank Predictor · Verified Official Recruitment Alerts
  </text>

  <!-- Key Highlights Pills -->
  <g transform="translate(100, 470)">
    <rect x="0" y="0" width="220" height="48" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">✓ 21/21 Integrity Score</text>

    <rect x="240" y="0" width="250" height="48" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="260" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">✓ All-India Rank Predictor</text>

    <rect x="510" y="0" width="230" height="48" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="530" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">✓ 00:00 Daily Current Affairs</text>
